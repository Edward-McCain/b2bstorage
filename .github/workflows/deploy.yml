name: Deploy to Servers

on:
  push:
    branches:
      - main
      - production

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: b2b-project/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./b2b-project/frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./b2b-project/frontend

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, fileinfo, tokenizer

      - name: Install backend dependencies
        run: composer install --no-dev --optimize-autoloader
        working-directory: ./b2b-project/backend

      - name: Deploy frontend to test server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          source: "b2b-project/frontend/dist/*"
          target: "/var/www/b2bstorage-frontend"
          strip_components: 3

      - name: Deploy backend to test server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          source: "b2b-project/backend/*"
          target: "/var/www/b2bstorage-backend"
          strip_components: 2

      - name: Deploy scripts to test server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          source: "init-production-server.sh,setup-postgresql.sh"
          target: "/var/www/b2bstorage-backend"

      - name: Set permissions and restart services on test server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          script: |
            # Set frontend permissions
            chown -R www-data:www-data /var/www/b2bstorage-frontend
            chmod -R 755 /var/www/b2bstorage-frontend
            
            # Set backend permissions
            chown -R www-data:www-data /var/www/b2bstorage-backend
            chmod -R 755 /var/www/b2bstorage-backend
            
            # Create storage directories if they don't exist
            mkdir -p /var/www/b2bstorage-backend/storage/framework/cache
            mkdir -p /var/www/b2bstorage-backend/storage/framework/sessions
            mkdir -p /var/www/b2bstorage-backend/storage/framework/views
            mkdir -p /var/www/b2bstorage-backend/storage/logs
            
            # Set storage permissions
            chown -R www-data:www-data /var/www/b2bstorage-backend/storage
            chmod -R 775 /var/www/b2bstorage-backend/storage
            
            # Run Laravel commands
            cd /var/www/b2bstorage-backend
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Restart services if needed
            systemctl reload nginx || true
            systemctl reload php8.4-fpm || true

      - name: Test deployment completed
        run: echo "✅ Test deployment completed successfully!"

  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: b2b-project/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./b2b-project/frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./b2b-project/frontend

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, fileinfo, tokenizer

      - name: Install backend dependencies
        run: composer install --no-dev --optimize-autoloader
        working-directory: ./b2b-project/backend

      - name: Deploy frontend to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          source: "b2b-project/frontend/dist/*"
          target: "/var/www/b2bstorage-frontend"
          strip_components: 3

      - name: Deploy backend to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          source: "b2b-project/backend/*"
          target: "/var/www/b2bstorage-backend"
          strip_components: 2

      - name: Deploy scripts to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          source: "init-production-server.sh,setup-postgresql.sh"
          target: "/var/www/b2bstorage-backend"

      - name: Set permissions and restart services on production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            # Set frontend permissions
            chown -R www-data:www-data /var/www/b2bstorage-frontend
            chmod -R 755 /var/www/b2bstorage-frontend
            
            # Set backend permissions
            chown -R www-data:www-data /var/www/b2bstorage-backend
            chmod -R 755 /var/www/b2bstorage-backend
            
            # Create storage directories if they don't exist
            mkdir -p /var/www/b2bstorage-backend/storage/framework/cache
            mkdir -p /var/www/b2bstorage-backend/storage/framework/sessions
            mkdir -p /var/www/b2bstorage-backend/storage/framework/views
            mkdir -p /var/www/b2bstorage-backend/storage/logs
            
            # Set storage permissions
            chown -R www-data:www-data /var/www/b2bstorage-backend/storage
            chmod -R 775 /var/www/b2bstorage-backend/storage
            
            # Run Laravel commands
            cd /var/www/b2bstorage-backend
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Restart services if needed
            systemctl reload nginx || true
            systemctl reload php8.4-fpm || true

      - name: Production deployment completed
        run: echo "✅ Production deployment completed successfully!" 