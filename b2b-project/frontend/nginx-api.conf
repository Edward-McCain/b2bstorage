server {
    listen 80;
    listen [::]:80;
    server_name api.b2bstorage.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.b2bstorage.ru;

    # SSL Configuration - улучшенная поддержка международных пользователей
    ssl_certificate /etc/letsencrypt/live/api.b2bstorage.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.b2bstorage.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Laravel root directory
    root /var/www/b2bstorage-app/public;
    index index.php index.html index.htm;

    # Security headers - улучшенные для международной поддержки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS headers for all API requests - улучшенные для международных пользователей
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-CSRF-TOKEN, X-XSRF-TOKEN, Cache-Control, Pragma, User-Agent, Referer, Accept-Language, Accept-Encoding, Connection, Upgrade-Insecure-Requests" always;
        add_header Access-Control-Expose-Headers "Cache-Control, Content-Language, Content-Type, Expires, Last-Modified, Pragma" always;
        add_header Access-Control-Max-Age 86400;
        add_header Access-Control-Allow-Credentials "true" always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle PHP files - улучшенная обработка
    location ~ \.php$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-CSRF-TOKEN, X-XSRF-TOKEN, Cache-Control, Pragma, User-Agent, Referer, Accept-Language, Accept-Encoding, Connection, Upgrade-Insecure-Requests" always;
        add_header Access-Control-Expose-Headers "Cache-Control, Content-Language, Content-Type, Expires, Last-Modified, Pragma" always;
        add_header Access-Control-Max-Age 86400;
        add_header Access-Control-Allow-Credentials "true" always;
        
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Улучшенные настройки FastCGI для международных пользователей
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Gzip compression для улучшения производительности
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/javascript
        application/json
        application/xml;

    # Увеличенные таймауты для международных пользователей
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;
    keepalive_requests 100;
} 