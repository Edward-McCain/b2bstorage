# HTTP -> HTTPS редирект
server {
    if ($host = www.b2bstorage.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = b2bstorage.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name b2bstorage.ru www.b2bstorage.ru;
    return 301 https://$server_name$request_uri;
}

# HTTPS конфигурация для фронтенда
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name b2bstorage.ru www.b2bstorage.ru;
    
    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/b2bstorage.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/b2bstorage.ru/privkey.pem; # managed by Certbot
    include /etc/nginx/snippets/ssl-params.conf;
    
    # Логи
    access_log /var/log/b2bstorage/access.log;
    error_log /var/log/b2bstorage/error.log;
    
    # Корневая директория для Vue.js фронтенда
    root /var/www/b2bstorage-frontend;
    index index.html;
    
    # Обработка Vue.js routing (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Кэширование статических файлов
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/javascript
        application/json;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
} 