<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Geolocation</title>
</head>
<body>
    <h1>Test Geolocation</h1>
    <button onclick="testIPLocation()">Test IP Location</button>
    <button onclick="testBrowserLocation()">Test Browser Location</button>
    <div id="results"></div>

    <script>
        async function testIPLocation() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing IP location...</p>';
            
            try {
                const response = await fetch('https://ipapi.co/json/', {
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    results.innerHTML = `<p>IP Location: ${JSON.stringify(data, null, 2)}</p>`;
                } else {
                    results.innerHTML = `<p>Error: ${response.status}</p>`;
                }
            } catch (error) {
                results.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }

        function testBrowserLocation() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing browser location...</p>';
            
            if (!navigator.geolocation) {
                results.innerHTML = '<p>Geolocation not supported</p>';
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    results.innerHTML = `<p>Browser Location: ${JSON.stringify(position.coords, null, 2)}</p>`;
                },
                (error) => {
                    results.innerHTML = `<p>Error: ${error.message}</p>`;
                }
            );
        }
    </script>
</body>
</html>
