<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Location Detection</title>
</head>
<body>
    <h1>Test Location Detection</h1>
    <button onclick="testAutoDetect()">Test Auto Detect</button>
    <div id="results"></div>

    <script>
        async function testAutoDetect() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing auto detect...</p>';
            
            try {
                // Тестируем IP геолокацию
                const response = await fetch('https://ipapi.co/json/');
                if (response.ok) {
                    const data = await response.json();
                    results.innerHTML = `<p>IP Location: ${JSON.stringify(data, null, 2)}</p>`;
                } else {
                    results.innerHTML = `<p>Error: ${response.status}</p>`;
                }
            } catch (error) {
                results.innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
